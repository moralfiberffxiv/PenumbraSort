name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Downloads Dalamud, extracts it, and sets DALAMUD_HOME automatically.
      # Dalamud.NET.Sdk reads DALAMUD_HOME to find the DLL references it needs.
      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true"  >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0.0"  >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        shell: pwsh
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      # DalamudPackager outputs latest.zip inside a folder named after the assembly.
      # We exclude the .nuget cache to avoid finding unrelated zips.
      - name: Locate and stage output zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter "latest.zip" `
                   | Where-Object { $_.FullName -notlike "*\.nuget\*" -and $_.FullName -notlike "*\dalamud\*" } `
                   | Select-Object -First 1
          if (!$zip) {
            Write-Error "latest.zip not found. Listing all build outputs:"
            Get-ChildItem -Recurse -Include "*.dll","*.zip","*.json" `
              | Where-Object { $_.FullName -notlike "*\.nuget\*" } `
              | Select-Object FullName
            exit 1
          }
          Write-Host "Found zip: $($zip.FullName)"

          # List contents so we can verify only DLL + JSON are inside
          Write-Host "Zip contents:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries
          $entries | ForEach-Object { Write-Host "  $($_.FullName)" }

          Copy-Item $zip.FullName "PenumbraSort.zip" -Force
          Write-Host "Staged as PenumbraSort.zip"

      - name: Update repo.json
        if: steps.version.outputs.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content repo.json -Raw | ConvertFrom-Json
          $dl = "https://github.com/${{ github.repository }}/releases/download/v${version}/PenumbraSort.zip"
          $content[0].AssemblyVersion        = $version
          $content[0].TestingAssemblyVersion = $version
          $content[0].DownloadLinkInstall    = $dl
          $content[0].DownloadLinkUpdate     = $dl
          $content[0].DownloadLinkTesting    = $dl
          $content | ConvertTo-Json -Depth 10 | Set-Content repo.json

      - name: Commit updated repo.json
        if: steps.version.outputs.IS_RELEASE == 'true'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --staged --quiet || git commit -m "chore: bump repo.json to v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: PenumbraSort.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraSort-${{ steps.version.outputs.VERSION }}
          path: PenumbraSort.zip
          retention-days: 30
