name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Downloads Dalamud, extracts it, and sets DALAMUD_HOME automatically.
      # Dalamud.NET.Sdk reads DALAMUD_HOME to find the DLL references it needs.
      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true"  >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0.0"  >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        shell: pwsh
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      # DalamudPackager writes latest.zip to: bin/Release/{AssemblyName}/latest.zip
      # The zip contains only DLL + JSON (deps.json excluded via csproj Exclude param)
      - name: Package plugin
        shell: pwsh
        run: |
          $zip = "bin\Release\PenumbraSort\latest.zip"
          if (!(Test-Path $zip)) {
            Write-Error "Expected zip not found at: $zip"
            Write-Host "Searching for any latest.zip..."
            Get-ChildItem -Recurse -Filter "latest.zip" | Where-Object { $_.FullName -notlike "*\.nuget\*" } | Select-Object FullName
            Write-Host "All build output files:"
            Get-ChildItem -Recurse -Include "*.dll","*.zip","*.json" | Where-Object { $_.FullName -notlike "*\.nuget\*" } | Select-Object FullName
            exit 1
          }

          # Print contents so we can verify it's only DLL + JSON
          Write-Host "Zip contents:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object { Write-Host "  $($_.FullName)" }

          Copy-Item $zip "PenumbraSort.zip" -Force
          Write-Host "Done — PenumbraSort.zip ready."

      - name: Create GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: PenumbraSort.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraSort-${{ steps.version.outputs.VERSION }}
          path: PenumbraSort.zip
          retention-days: 30
