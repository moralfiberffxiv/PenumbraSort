name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Downloads Dalamud, extracts it, and sets DALAMUD_HOME automatically.
      # Dalamud.NET.Sdk reads DALAMUD_HOME to find the DLL references it needs.
      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true"  >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0.0"  >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        shell: pwsh
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      # Manually zip only the DLL and manifest — nothing else.
      # Dalamud's installer requires exactly these two files at the zip root.
      - name: Package plugin
        shell: pwsh
        run: |
          # Find the built DLL (exclude nuget cache)
          $dll = Get-ChildItem -Recurse -Filter "PenumbraSort.dll" `
                   | Where-Object { $_.FullName -notlike "*\.nuget\*" -and $_.FullName -notlike "*\ref\*" } `
                   | Select-Object -First 1

          if (!$dll) {
            Write-Error "PenumbraSort.dll not found. Build output:"
            Get-ChildItem -Recurse -Include "*.dll" | Where-Object { $_.FullName -notlike "*\.nuget\*" } | Select-Object FullName
            exit 1
          }

          $outDir = $dll.DirectoryName
          $jsonFile = Join-Path $outDir "PenumbraSort.json"

          Write-Host "DLL:  $($dll.FullName)"
          Write-Host "JSON: $jsonFile"

          if (!(Test-Path $jsonFile)) {
            Write-Error "PenumbraSort.json not found next to DLL. Files in output dir:"
            Get-ChildItem $outDir | Select-Object Name
            exit 1
          }

          # Zip only these two files, flat at the root (no subfolders)
          Compress-Archive -Path $dll.FullName, $jsonFile -DestinationPath "PenumbraSort.zip" -Force

          # Verify contents
          Write-Host "Zip contents:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("PenumbraSort.zip").Entries `
            | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Create GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: PenumbraSort.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraSort-${{ steps.version.outputs.VERSION }}
          path: PenumbraSort.zip
          retention-days: 30
