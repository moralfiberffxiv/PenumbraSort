name: Build PenumbraSort

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Create artifact directory
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        if (!(Test-Path -Path "artifact")) {
          New-Item -ItemType Directory -Path "artifact"
        }
      shell: pwsh
        
    - name: Copy DLL to artifact
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Copy-Item -Path "bin\x64\Release\net8.0-windows\PenumbraSort.dll" -Destination "artifact\PenumbraSort.dll"
      shell: pwsh

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: artifact/PenumbraSort.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
