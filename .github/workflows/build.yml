name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true"  >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0.0"  >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore

      - name: Create Dalamud stub assemblies
        shell: pwsh
        run: |
          $dalamudPath = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudPath -Force | Out-Null
          
          Write-Host "Setting up Dalamud stubs at: $dalamudPath"
          
          # Download Dalamud release from GitHub API
          try {
            Write-Host "Fetching latest Dalamud release..."
            $releaseUrl = "https://api.github.com/repos/goatcorp/Dalamud/releases/latest"
            $release = Invoke-RestMethod -Uri $releaseUrl -ErrorAction Stop
            $zipUrl = $release.assets | Where-Object { $_.name -eq "latest.zip" } | Select-Object -ExpandProperty browser_download_url
            
            if ($zipUrl) {
              Write-Host "Downloading from: $zipUrl"
              $tempZip = "$env:TEMP\dalamud-latest.zip"
              Invoke-WebRequest -Uri $zipUrl -OutFile $tempZip -ErrorAction Stop
              Expand-Archive -Path $tempZip -DestinationPath $dalamudPath -Force
              Write-Host "Dalamud extracted successfully"
            } else {
              throw "No latest.zip found in release assets"
            }
          } catch {
            Write-Host "Warning: Could not download Dalamud from GitHub: $_"
            Write-Host "Creating minimal PE stubs as fallback..."
            
            # Create proper PE header that won't crash the compiler
            $peHeader = @(
              0x4D, 0x5A, 0x90, 0x00, 0x03, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00,
              0xFF, 0xFF, 0x00, 0x00, 0xB8, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x80, 0x00, 0x00, 0x00, 0x0E, 0x1F, 0xBA, 0x0E, 0x00, 0xB4, 0x09, 0xCD,
              0x21, 0xB8, 0x01, 0x4C, 0xCD, 0x21, 0x54, 0x68, 0x69, 0x73, 0x20, 0x70,
              0x72, 0x6F, 0x67, 0x72, 0x61, 0x6D, 0x20, 0x63, 0x61, 0x6E, 0x6E, 0x6F,
              0x74, 0x20, 0x62, 0x65, 0x20, 0x72, 0x75, 0x6E, 0x20, 0x69, 0x6E, 0x20,
              0x44, 0x4F, 0x53, 0x20, 0x6D, 0x6F, 0x64, 0x65, 0x2E, 0x0D, 0x0D, 0x0A,
              0x24, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00
            )
            
            $dlls = @("Dalamud.dll", "ImGui.NET.dll", "ImGuiScene.dll", "Newtonsoft.Json.dll")
            foreach ($dll in $dlls) {
              $path = Join-Path $dalamudPath $dll
              [System.IO.File]::WriteAllBytes($path, [byte[]]$peHeader)
              Write-Host "Created fallback stub: $dll"
            }
          }
          
          Get-ChildItem $dalamudPath -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "✓ $($_.Name) ($($_.Length) bytes)"
          }

      - name: Build
        shell: pwsh
        run: dotnet build --configuration Release /p:AssemblyVersion=${{ steps.version.outputs.VERSION }} /p:FileVersion=${{ steps.version.outputs.VERSION }} --no-restore

      # Dalamud.NET.Sdk + DalamudPackager auto-generates a latest.zip in the output folder
      - name: Locate and rename output zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter "latest.zip" | Select-Object -First 1
          if (!$zip) {
            Write-Error "latest.zip not found — listing all output files for debug:"
            Get-ChildItem -Recurse -Include "*.dll","*.zip","*.json" | Select-Object FullName
            exit 1
          }
          Write-Host "Found zip at: $($zip.FullName)"
          Copy-Item $zip.FullName "PenumbraSort.zip" -Force

      - name: Update repo.json
        if: steps.version.outputs.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $content = Get-Content repo.json -Raw | ConvertFrom-Json
          $content[0].AssemblyVersion        = $version
          $content[0].TestingAssemblyVersion = $version
          $content[0].DownloadLinkInstall    = "https://github.com/${{ github.repository }}/releases/download/v${version}/PenumbraSort.zip"
          $content[0].DownloadLinkUpdate     = "https://github.com/${{ github.repository }}/releases/download/v${version}/PenumbraSort.zip"
          $content[0].DownloadLinkTesting    = "https://github.com/${{ github.repository }}/releases/download/v${version}/PenumbraSort.zip"
          $content | ConvertTo-Json -Depth 10 | Set-Content repo.json
          Write-Host "repo.json updated to version $version"

      - name: Commit updated repo.json
        if: steps.version.outputs.IS_RELEASE == 'true'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --staged --quiet || git commit -m "chore: bump repo.json to v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: PenumbraSort.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraSort-${{ steps.version.outputs.VERSION }}
          path: PenumbraSort.zip
          retention-days: 30
