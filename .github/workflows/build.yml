name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Downloads Dalamud, extracts it, and sets DALAMUD_HOME automatically.
      # Dalamud.NET.Sdk reads DALAMUD_HOME to find the DLL references it needs.
      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true"  >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0.0"  >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        shell: pwsh
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      # Manual zip — cd into the output dir first so Compress-Archive stores
      # filenames only (no path prefix). This guarantees DLL+JSON sit at the
      # zip root, which is what Dalamud's installer requires.
      - name: Package plugin
        shell: pwsh
        run: |
          # DalamudPackager (no MakeZip) still generates PenumbraSort.json next to the DLL.
          # Find the output directory by locating the DLL.
          $dll = Get-ChildItem -Recurse -Filter "PenumbraSort.dll" `
                 | Where-Object { $_.FullName -notlike "*\.nuget\*" -and $_.FullName -notlike "*\ref\*" } `
                 | Select-Object -First 1

          if (!$dll) {
            Write-Error "PenumbraSort.dll not found. All DLLs found:"
            Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notlike "*\.nuget\*" } | Select-Object FullName
            exit 1
          }

          $outDir = $dll.DirectoryName
          $jsonPath = Join-Path $outDir "PenumbraSort.json"

          Write-Host "Output dir : $outDir"
          Write-Host "DLL        : $($dll.FullName)"
          Write-Host "JSON       : $jsonPath"

          if (!(Test-Path $jsonPath)) {
            Write-Error "PenumbraSort.json missing. Files in output dir:"
            Get-ChildItem $outDir | Select-Object Name
            exit 1
          }

          # CRITICAL: Push-Location so Compress-Archive uses relative paths,
          # producing a flat zip (no directory prefix on entries).
          Push-Location $outDir
          Compress-Archive -Path "PenumbraSort.dll", "PenumbraSort.json" `
                           -DestinationPath "$env:GITHUB_WORKSPACE\PenumbraSort.zip" `
                           -Force
          Pop-Location

          # Verify — must show exactly 2 entries, both at root with no path prefix
          Write-Host "Verifying zip contents (must be exactly DLL + JSON at root):"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$env:GITHUB_WORKSPACE\PenumbraSort.zip").Entries
          $entries | ForEach-Object { Write-Host "  [$($_.FullName)]" }
          if ($entries.Count -ne 2) {
            Write-Error "Expected exactly 2 files in zip, got $($entries.Count). Aborting."
            exit 1
          }
          Write-Host "Package OK — $($entries.Count) files confirmed."

      - name: Create GitHub Release
        if: steps.version.outputs.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: PenumbraSort.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraSort-${{ steps.version.outputs.VERSION }}
          path: PenumbraSort.zip
          retention-days: 30
